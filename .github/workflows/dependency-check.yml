name: Dependency check and build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build and Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '11'
        cache: maven

    - name: Cache OWASP Dependency-Check data (optional)
      uses: actions/cache@v3
      with:
        path: ~/.local/share/dependency-check
        key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}

    - name: Build (package, skip tests)
      run: mvn -B -DskipTests package

    - name: Run OWASP dependency-check (generate reports, do not fail job)
      run: |
        # invoke the plugin directly and override the fail threshold so the job continues
        mvn org.owasp:dependency-check-maven:8.4.0:check -DfailBuildOnCVSS=11

    - name: Upload dependency-check report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report/

    - name: Create issue if high/critical vulnerabilities found
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'target/dependency-check-report/dependency-check-report.xml';
          if (!fs.existsSync(path)) {
            console.info('No dependency-check XML report found at ' + path);
            return;
          }
          const xml = fs.readFileSync(path, 'utf8');
          const criticalMatches = xml.match(/<severity>CRITICAL<\/severity>/gi) || [];
          const highMatches = xml.match(/<severity>HIGH<\/severity>/gi) || [];
          const critical = criticalMatches.length;
          const high = highMatches.length;
          console.info(`Found ${critical} critical and ${high} high vulnerabilities`);
          if (critical + high > 0) {
            const title = `Dependency-check: ${critical} critical, ${high} high vulnerabilities found`;
            const body = `The dependency-check report generated by the workflow found **${critical} critical** and **${high} high** vulnerabilities.\n\n` +
              `Download the full report from the workflow run artifacts (artifact name: dependency-check-report).\n\n` +
              `This issue was created automatically by the dependency-check workflow. Please review and triage the findings.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
          } else {
            console.info('No high or critical vulnerabilities detected; no issue created.');
          }
