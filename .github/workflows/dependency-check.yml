name: Dependency check and build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build and Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK 1.8
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '1.8'
        cache: maven

    - name: Cache OWASP Dependency-Check data (optional)
      uses: actions/cache@v3
      with:
        path: ~/.local/share/dependency-check
        key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}

    - name: Build and run dependency-check
      run: mvn -B -DskipTests verify

    - name: Upload dependency-check report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: target/dependency-check-report/
