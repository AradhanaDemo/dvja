version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Allow minor and patch updates automatically; major updates will still need review
    allow:
      - dependency-type: "direct"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
